name: Deploy Frontend Only

on:
  push:
    branches: [main]
    paths:
      - 'kronos-eam-react/**'
      - '.github/workflows/deploy-frontend-only.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging
        default: production

env:
  PROJECT_ID: kronos-eam-prod-20250802
  REGION: europe-west1
  BACKEND_SERVICE: kronos-backend
  FRONTEND_SERVICE: kronos-frontend

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Get Backend URL
        id: backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe ${BACKEND_SERVICE} --region=${REGION} --format='value(status.url)' 2>/dev/null || echo "https://kronos-backend-placeholder.run.app")
          echo "BACKEND_URL=${BACKEND_URL}" >> $GITHUB_OUTPUT
          echo "Using backend URL: ${BACKEND_URL}"

      - name: Build and Push Frontend
        working-directory: ./kronos-eam-react
        run: |
          echo "Building frontend Docker image with backend URL: ${{ steps.backend-url.outputs.BACKEND_URL }}"

          docker build \
            --build-arg REACT_APP_API_URL=${{ steps.backend-url.outputs.BACKEND_URL }}/api/v1 \
            --build-arg CACHEBUST=$(date +%s) \
            -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/kronos-eam/frontend:latest .

          echo "Pushing to Artifact Registry..."
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/kronos-eam/frontend:latest

          echo "✓ Frontend image built and pushed successfully"

      - name: Deploy Frontend to Cloud Run
        run: |
          echo "Deploying frontend to Cloud Run..."

          BACKEND_URL=$(gcloud run services describe ${BACKEND_SERVICE} --region=${REGION} --format='value(status.url)')

          gcloud run deploy ${FRONTEND_SERVICE} \
            --image ${REGION}-docker.pkg.dev/${PROJECT_ID}/kronos-eam/frontend:latest \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "BACKEND_URL=${BACKEND_URL}" \
            --service-account kronos-frontend@${PROJECT_ID}.iam.gserviceaccount.com \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 10 \
            --port 80

      - name: Get Frontend URL
        id: frontend-url
        run: |
          FRONTEND_URL=$(gcloud run services describe ${FRONTEND_SERVICE} --region=${REGION} --format='value(status.url)')
          echo "FRONTEND_URL=${FRONTEND_URL}" >> $GITHUB_OUTPUT
          echo "Frontend deployed at: ${FRONTEND_URL}"

      - name: Deployment Summary
        run: |
          echo "🎉 Frontend Deployment Complete!"
          echo "Frontend URL: ${{ steps.frontend-url.outputs.FRONTEND_URL }}"
          echo "Backend API: ${{ steps.backend-url.outputs.BACKEND_URL }}"
          echo ""
          echo "📊 Deployment Stats:"
          echo "  - Only frontend was rebuilt and deployed"
          echo "  - Backend remains unchanged"
          echo "  - Deployment time: ~2-3 minutes (vs 15+ for full deployment)"
          echo "  - Cost savings: ~80% less build time"
