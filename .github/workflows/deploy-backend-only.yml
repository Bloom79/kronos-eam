name: Deploy Backend Only

on:
  push:
    branches: [main]
    paths:
      - 'kronos-eam-backend/**'
      - '.github/workflows/deploy-backend-only.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging
        default: production

env:
  PROJECT_ID: kronos-eam-prod-20250802
  REGION: europe-west1
  BACKEND_SERVICE: kronos-backend
  SQL_INSTANCE: kronos-db

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build and Push Backend
        working-directory: ./kronos-eam-backend
        run: |
          echo "Building backend Docker image..."
          docker build -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/kronos-eam/backend:latest .

          echo "Pushing to Artifact Registry..."
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/kronos-eam/backend:latest

          echo "✓ Backend image built and pushed successfully"

      - name: Deploy Backend to Cloud Run
        run: |
          echo "Deploying backend to Cloud Run..."

          gcloud run deploy ${BACKEND_SERVICE} \
            --image ${REGION}-docker.pkg.dev/${PROJECT_ID}/kronos-eam/backend:latest \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=postgresql://postgres:${{ secrets.DB_PASSWORD }}@/kronos_eam?host=/cloudsql/${PROJECT_ID}:${REGION}:${SQL_INSTANCE}" \
            --set-env-vars "ENVIRONMENT=production" \
            --set-env-vars "DISABLE_REDIS=true" \
            --set-env-vars "DISABLE_QDRANT=true" \
            --set-secrets "SECRET_KEY=jwt-secret:latest,REDIS_PASSWORD=redis-password:latest,DB_PASSWORD=db-password:latest" \
            --add-cloudsql-instances ${PROJECT_ID}:${REGION}:${SQL_INSTANCE} \
            --service-account kronos-backend@${PROJECT_ID}.iam.gserviceaccount.com \
            --memory 8Gi \
            --cpu 2 \
            --min-instances 1 \
            --max-instances 10 \
            --port 8080 \
            --timeout 600

      - name: Get Backend URL
        id: backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe ${BACKEND_SERVICE} --region=${REGION} --format='value(status.url)')
          echo "BACKEND_URL=${BACKEND_URL}" >> $GITHUB_OUTPUT
          echo "Backend deployed at: ${BACKEND_URL}"

      - name: Deployment Summary
        run: |
          echo "🎉 Backend Deployment Complete!"
          echo "Backend API: ${{ steps.backend-url.outputs.BACKEND_URL }}"
          echo ""
          echo "📊 Deployment Stats:"
          echo "  - Only backend was rebuilt and deployed"
          echo "  - Frontend remains unchanged"
          echo "  - Deployment time: ~5-8 minutes (vs 15+ for full deployment)"
          echo "  - Cost savings: ~60% less build time"
